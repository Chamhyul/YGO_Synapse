name: Deploy to Firebase on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions Dependencies
        run: cd functions && npm ci

      - name: Check keyless authentication settings
        env:
          WIF_PROVIDER: ${{ vars.GCP_DEPLOY_WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$WIF_SERVICE_ACCOUNT" ]; then
            echo "::error::GCP_DEPLOY_WIF_PROVIDER와 GCP_DEPLOY_SERVICE_ACCOUNT 설정이 필요합니다."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ygo-synapse
          workload_identity_provider: ${{ vars.GCP_DEPLOY_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase (Hosting, Functions, Rules)
        # 소스에서 의도적으로 제거된 구형 Functions도 CI에서 정리할 수 있게 합니다.
        run: npx firebase-tools deploy --project ygo-synapse --non-interactive --force
