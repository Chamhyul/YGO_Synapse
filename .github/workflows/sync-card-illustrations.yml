name: Sync card illustrations

on:
  workflow_dispatch:
  schedule:
    # 매일 한국 시간 오전 3시 30분
    - cron: "30 18 * * *"

concurrency:
  group: card-illustration-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install illustration dependencies
        run: npm ci

      - name: Install Firebase dependencies
        working-directory: functions
        run: npm ci

      - name: Check keyless authentication settings
        env:
          WIF_PROVIDER: ${{ vars.GCP_ILLUSTRATIONS_WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.GCP_ILLUSTRATIONS_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$WIF_SERVICE_ACCOUNT" ]; then
            echo "::error::GCP_ILLUSTRATIONS_WIF_PROVIDER와 GCP_ILLUSTRATIONS_SERVICE_ACCOUNT 설정이 필요합니다."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ygo-synapse
          workload_identity_provider: ${{ vars.GCP_ILLUSTRATIONS_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_ILLUSTRATIONS_SERVICE_ACCOUNT }}

      - name: Synchronize changed illustrations
        run: node scripts/sync_card_illustrations_cloud.js --apply
