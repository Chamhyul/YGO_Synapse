name: ygo-synapse

x-common: &common
  image: ygo-synapse:local
  build: .
  init: true
  stop_grace_period: 2m
  # 소스 폴더만 읽기 전용으로 연결한다. 호스트의 인증정보·의존성은 연결하지 않는다.
  volumes:
    # 자체 합성 견본을 기존 검사 경로에도 연결한다. 이미지에는 scripts/fixtures로 포함한다.
    - type: bind
      source: ./scripts/fixtures/document-specimen.html
      target: /app/previews/document-specimen.html
      read_only: true
      bind:
        create_host_path: false
    - ./card-service:/app/card-service:ro
    - ./public:/app/public:ro
    - ./scripts:/app/scripts:ro
    - ./docker:/app/docker:ro
    - ./functions/config:/app/functions/config:ro
    - ./functions/integrations:/app/functions/integrations:ro
    - ./functions/routes:/app/functions/routes:ro
    - ./functions/schedules:/app/functions/schedules:ro
    - ./functions/scrapers:/app/functions/scrapers:ro
    - ./functions/services:/app/functions/services:ro
    - ./functions/tasks:/app/functions/tasks:ro
    - ./functions/templates:/app/functions/templates:ro
    - ./functions/test:/app/functions/test:ro
    - ./functions/utils:/app/functions/utils:ro
    - ./functions/index.js:/app/functions/index.js:ro
    - ./functions/package.json:/app/functions/package.json:ro
    - ./functions/package-lock.json:/app/functions/package-lock.json:ro
    - ./package.json:/app/package.json:ro
    - ./package-lock.json:/app/package-lock.json:ro
    - ./firebase.json:/app/firebase.json:ro
    - ./.firebaserc:/app/.firebaserc:ro
    - ./.gitignore:/app/.gitignore:ro
    - ./.github/workflows:/app/.github/workflows:ro
    - ./firestore.rules:/app/firestore.rules:ro
    - ./firestore.indexes.json:/app/firestore.indexes.json:ro
    - ./storage.rules:/app/storage.rules:ro

services:
  read-api:
    image: ygo-synapse:local
    build: .
    command: [node, functions/server.js]
    profiles: [read-api]
    environment:
      GCLOUD_PROJECT: ${MAIN_PROJECT_ID:-}
      STORAGE_BUCKET: ${MAIN_STORAGE_BUCKET:-}
      CARD_SERVICE_URL: ${CARD_SERVICE_URL:-}
      CARD_SERVICE_AUDIENCE: ${CARD_SERVICE_AUDIENCE:-}
    ports: ["127.0.0.1:5090:8080"]
    restart: "no"
  dev:
    <<: *common
    command: [dev]
    ports:
      - "127.0.0.1:5001:5001"
      - "127.0.0.1:5002:5002"
      - "127.0.0.1:5003:5003"
      - "127.0.0.1:5004:5004"
      - "127.0.0.1:5005:5005"
      - "127.0.0.1:9150:9150"
    volumes:
      - ./public:/app/public:ro
      - ./scripts:/app/scripts:ro
      - ./docker:/app/docker:ro
      - ./functions/config:/app/functions/config:ro
      - ./functions/integrations:/app/functions/integrations:ro
      - ./functions/routes:/app/functions/routes:ro
      - ./functions/schedules:/app/functions/schedules:ro
      - ./functions/scrapers:/app/functions/scrapers:ro
      - ./functions/services:/app/functions/services:ro
      - ./functions/tasks:/app/functions/tasks:ro
      - ./functions/templates:/app/functions/templates:ro
      - ./functions/test:/app/functions/test:ro
      - ./functions/utils:/app/functions/utils:ro
      - ./functions/index.js:/app/functions/index.js:ro
      - ./functions/package.json:/app/functions/package.json:ro
      - ./functions/package-lock.json:/app/functions/package-lock.json:ro
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - ./firebase.json:/app/firebase.json:ro
      - ./.firebaserc:/app/.firebaserc:ro
      - ./.gitignore:/app/.gitignore:ro
      - ./.github/workflows:/app/.github/workflows:ro
      - ./firestore.rules:/app/firestore.rules:ro
      - ./firestore.indexes.json:/app/firestore.indexes.json:ro
      - ./storage.rules:/app/storage.rules:ro
      - local-data:/data
    healthcheck:
      test: [CMD, node, /app/docker/healthcheck.cjs]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 4
    restart: "no"

  tests:
    <<: *common
    profiles: [tests]
    command: [test]
    network_mode: none
    restart: "no"

  browser-tests:
    <<: *common
    profiles: [tests]
    command: [browser-test]
    network_mode: none
    shm_size: 1gb
    environment:
      MEMBERSHIP_TEST_BROWSER: chromium
      TEST_ARTIFACT_DIR: /test-results
      TEST_WEB_ASSETS: /opt/browser-assets
    volumes:
      - ./public:/app/public:ro
      - ./scripts:/app/scripts:ro
      - ./docker:/app/docker:ro
      - ./functions/config:/app/functions/config:ro
      - ./functions/integrations:/app/functions/integrations:ro
      - ./functions/routes:/app/functions/routes:ro
      - ./functions/schedules:/app/functions/schedules:ro
      - ./functions/scrapers:/app/functions/scrapers:ro
      - ./functions/services:/app/functions/services:ro
      - ./functions/tasks:/app/functions/tasks:ro
      - ./functions/templates:/app/functions/templates:ro
      - ./functions/test:/app/functions/test:ro
      - ./functions/utils:/app/functions/utils:ro
      - ./functions/index.js:/app/functions/index.js:ro
      - ./functions/package.json:/app/functions/package.json:ro
      - ./functions/package-lock.json:/app/functions/package-lock.json:ro
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - ./firebase.json:/app/firebase.json:ro
      - ./.firebaserc:/app/.firebaserc:ro
      - ./.gitignore:/app/.gitignore:ro
      - ./.github/workflows:/app/.github/workflows:ro
      - ./firestore.rules:/app/firestore.rules:ro
      - ./firestore.indexes.json:/app/firestore.indexes.json:ro
      - ./storage.rules:/app/storage.rules:ro
      - browser-results:/test-results
    restart: "no"

# 기존 개발 서버 정상 종료·데이터 내보내기 후에만 이 폴더에서 dev를 전환한다.
# 기존 볼륨을 재사용하며 실행 중인 서버와 동시에 연결하지 않는다.
volumes:
  local-data:
    name: ygo-main-service_local-data
    external: true
  browser-results:
    name: ygo-main-service_browser-results
