name: ygo-user-migration-test
services:
  emulators:
    image: ${MAIN_IMAGE:-ygo-synapse:local}
    init: true
    command: [firebase, emulators:start, --config, integration/user-migration/firebase.json, --project, demo-user-migration, --only, "firestore,storage,database,auth", --non-interactive]
    networks: [isolated]
    healthcheck:
      test: [CMD, node, integration/user-migration/healthcheck.cjs]
      interval: 2s
      timeout: 2s
      start_period: 10s
      retries: 40
    restart: "no"
  tests:
    image: ${MAIN_IMAGE:-ygo-synapse:local}
    init: true
    command: [node, --test, --test-concurrency=1, functions/test/userMigrationRehearsal.integration.js, functions/test/userWriterTransition.integration.js, functions/test/userProfileWriter.integration.js, functions/test/userInventoryWriter.integration.js, functions/test/userInventoryWriterLatency.integration.js, functions/test/inventoryRequestTiming.integration.js, functions/test/userMembershipWriter.integration.js, functions/test/adminSessionWriter.integration.js, functions/test/cardApiWriter.integration.js, functions/test/membershipCsvWriter.integration.js, functions/test/adminWriter.integration.js, functions/test/writerHistory.integration.js, functions/test/writerPlan.integration.js, functions/test/writerRoute.integration.js, functions/test/userWriterRuntime.integration.js, functions/test/userWriterRouteReuse.integration.js, functions/test/writerHotPath.integration.js, functions/test/writerLatencyBoundaries.integration.js]
    environment:
      NODE_ENV: test
      GCLOUD_PROJECT: demo-user-migration
      USER_STORAGE_BACKEND: rtdb
      FIREBASE_DATABASE_EMULATOR_HOST: emulators:9000
      USER_DATABASE_URL: http://emulators:9000?ns=demo-user-migration-default-rtdb
      FIRESTORE_EMULATOR_HOST: emulators:8080
      FIREBASE_STORAGE_EMULATOR_HOST: emulators:9199
      FIREBASE_AUTH_EMULATOR_HOST: emulators:9099
    depends_on:
      emulators: {condition: service_healthy}
    networks: [isolated]
    restart: "no"
networks:
  isolated:
    internal: true
